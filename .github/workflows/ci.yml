name: TRUST CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/full-hero-selector

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Overwolf Electron dependencies
        run: npm --prefix apps/overwolf-electron install --ignore-scripts

      - name: Core tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Overwolf Electron TypeScript
        run: npm run electron:typecheck

      - name: Production build
        run: npm run build

      - name: Overwolf Electron build contract
        run: npm run overwolf:build
