name: Apply stale reset lifecycle fix

on:
  push:
    branches:
      - feature/mid-intelligence-pack-1
    paths:
      - .github/workflows/release-stale-reset.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mid-intelligence-pack-1
          fetch-depth: 0

      - name: Apply lifecycle fix
        run: node scripts/release-stale-reset.mjs

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No lifecycle changes to commit."
            exit 0
          fi
          git commit -m "Release stale emergency reset after recovery"
          git push origin HEAD:feature/mid-intelligence-pack-1
