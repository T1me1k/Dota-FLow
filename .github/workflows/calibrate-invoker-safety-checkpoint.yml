name: Calibrate Invoker safety checkpoint

on:
  push:
    branches:
      - feature/mid-intelligence-pack-1
    paths:
      - .github/workflows/calibrate-invoker-safety-checkpoint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mid-intelligence-pack-1
          fetch-depth: 0

      - name: Apply checkpoint calibration
        run: node scripts/calibrate-invoker-safety-checkpoint.mjs

      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No calibration changes to commit."
            exit 0
          fi
          git commit -m "Calibrate precise Invoker safety checkpoint"
          git push origin HEAD:feature/mid-intelligence-pack-1
