name: Apply mid profile pack

on:
  push:
    branches:
      - feature/mid-intelligence-pack-1
    paths:
      - .github/workflows/apply-mid-profile-pack.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mid-intelligence-pack-1
          fetch-depth: 0

      - name: Apply profile integration
        run: node scripts/apply-mid-profile-pack.mjs

      - name: Commit integrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Integrate first detailed mid hero pack [skip ci]"
          git push origin HEAD:feature/mid-intelligence-pack-1
